<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت محصولات | الکتریکی دهانی</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#17212b;font-family:Tahoma,Arial,sans-serif;line-height:1.8}.wrap{max-width:850px;margin:auto;padding:20px 4%}h1{font-size:23px}section{background:white;padding:18px;border-radius:14px;margin:16px 0;border:1px solid #e0e5eb}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.row input,.row textarea,.row select{width:100%;padding:11px;border:1px solid #ccd3db;border-radius:9px;font:inherit;margin-bottom:10px}button,.btn{padding:10px 14px;border:0;border-radius:9px;background:#ffc928;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none;color:#111}.green{background:#168a55;color:white}.red{background:#c93d3d;color:white}.product{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 0;flex-wrap:wrap}.product small{display:block;color:#667381}.muted{color:#667381;font-size:13px}.hidden{display:none}.msg{padding:10px;border-radius:8px;background:#fff4ce}.product button{margin:3px}</style></head>
<body><main class="wrap"><a href="/" class="btn">← برگشت به فروشگاه</a><h1>🔐 پنل مدیریت الکتریکی دهانی</h1>
<section id="loginBox"><h2>ورود صاحب فروشگاه</h2><p class="muted">رمز مدیریتی که در تنظیمات Cloudflare گذاشته‌اید را وارد کنید.</p><input id="password" type="password" placeholder="رمز مدیریت" style="width:100%;padding:12px;border:1px solid #ccd3db;border-radius:9px;font:inherit"><p><button id="login" class="green">ورود</button></p><div id="loginMsg"></div></section>
<div id="app" class="hidden"><section><h2 id="formTitle">➕ افزودن محصول</h2><form id="productForm"><input id="pid" type="hidden"><div class="row"><input id="name" placeholder="نام محصول (مثلاً لامپ LED)" required><input id="category" placeholder="دسته‌بندی (مثلاً روشنایی)"><input id="price" type="number" min="0" placeholder="قیمت به تومان (۰ یعنی تماس بگیرید)"><input id="stock" type="number" min="-1" placeholder="موجودی (خالی یعنی نامشخص)"></div><div class="row"><input id="image" type="url" placeholder="لینک عکس محصول (اختیاری)"><textarea id="description" placeholder="توضیح کوتاه (اختیاری)"></textarea></div><button class="green" type="submit">ذخیره محصول</button> <button type="button" id="cancel" class="hidden">لغو ویرایش</button></form><div id="formMsg"></div></section>
<section><h2>📦 محصولات ثبت‌شده</h2><div id="list">در حال بارگذاری…</div></section><p><button id="logout" class="red">خروج از پنل</button></p></div></main>
<script>
const $=id=>document.getElementById(id);let password='',products=[];
async function api(method='GET',body){let r=await fetch('/api/products',{method,headers:{'Content-Type':'application/json','X-Admin-Password':password},body:body?JSON.stringify(body):undefined});let d=await r.json().catch(()=>({error:'پاسخ نامعتبر'}));if(!r.ok)throw Error(d.error||'خطا');return d}
$('login').onclick=async()=>{password=$('password').value;try{await api();$('loginBox').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}catch(e){$('loginMsg').textContent='ورود ناموفق است؛ رمز را بررسی کن و مطمئن شو تنظیمات سرور انجام شده.'}};
async function refresh(){try{let d=await api();products=d.products||[];render()}catch(e){$('list').textContent='خطا: '+e.message+' — باید KV و رمز مدیریت در Cloudflare تنظیم شوند.'}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){$('list').innerHTML=products.length?products.map(p=>`<div class="product"><div><b>${esc(p.name)}</b><small>${esc(p.category||'بدون دسته')} • ${Number(p.price)>0?Number(p.price).toLocaleString('fa-IR')+' تومان':'قیمت با تماس'} • ${p.stock===0?'ناموجود':p.stock>0?'موجودی '+p.stock:'موجودی نامشخص'}</small></div><div><button onclick="edit('${p.id}')">ویرایش</button><button class="red" onclick="removeProduct('${p.id}')">حذف</button></div></div>`).join(''):'هنوز محصولی ثبت نکرده‌ای.'}
$('productForm').onsubmit=async e=>{e.preventDefault();let p={id:$('pid').value||undefined,name:$('name').value.trim(),category:$('category').value.trim(),price:Number($('price').value||0),stock:$('stock').value===''?-1:Number($('stock').value),image:$('image').value.trim(),description:$('description').value.trim()};try{await api('POST',p);$('formMsg').textContent='محصول ذخیره شد.';clearForm();await refresh()}catch(err){$('formMsg').textContent='ذخیره نشد: '+err.message}};
window.edit=id=>{let p=products.find(x=>x.id===id);if(!p)return;$('pid').value=p.id;$('name').value=p.name;$('category').value=p.category||'';$('price').value=p.price||0;$('stock').value=p.stock??-1;$('image').value=p.image||'';$('description').value=p.description||'';$('formTitle').textContent='✏️ ویرایش محصول';$('cancel').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};
window.removeProduct=async id=>{if(!confirm('این محصول حذف شود؟'))return;try{await api('DELETE',{id});await refresh()}catch(e){alert('حذف نشد: '+e.message)}};
function clearForm(){$('productForm').reset();$('pid').value='';$('formTitle').textContent='➕ افزودن محصول';$('cancel').classList.add('hidden')}
$('cancel').onclick=clearForm;$('logout').onclick=()=>{password='';$('password').value='';$('app').classList.add('hidden');$('loginBox').classList.remove('hidden')};
</script></body></html>
